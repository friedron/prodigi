name: prodigi
channels:
    - pytorch
    - nvidia
    - conda-forge
    - defaults
dependencies:
    - python=3.11
    - python-socketio
    - tornado
    - python-dotenv
    - httpx
    - reportlab
    - ffmpeg  # MP4 export of the MCMC walk animation
    - pip
    - pip:
          - bimquake
          - digital-twinning>=2.0.5
          - earthkit-data
          - pyuff
          - mosaictools>=1.0.4  # Mosaic.validate, used for the modal-validation boxplot
          - openmeteo-requests
          - requests_cache
          - retry-requests
          - torchnaut
          - kaleido==0.2.1
